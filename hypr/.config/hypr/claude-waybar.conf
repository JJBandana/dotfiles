# claude-waybar: "modo Claude" por teclado. SUPER+C entra; mirá Waybar para los números.
bind = SUPER, C, submap, claude
bind = SUPER, C, exec, ~/.local/bin/claude-waybar mode

submap = claude
bind = , 1, exec, ~/.local/bin/claude-waybar goto 1
bind = , 1, submap, reset
bind = , 2, exec, ~/.local/bin/claude-waybar goto 2
bind = , 2, submap, reset
bind = , 3, exec, ~/.local/bin/claude-waybar goto 3
bind = , 3, submap, reset
bind = , 4, exec, ~/.local/bin/claude-waybar goto 4
bind = , 4, submap, reset
bind = , 5, exec, ~/.local/bin/claude-waybar goto 5
bind = , 5, submap, reset
bind = , 6, exec, ~/.local/bin/claude-waybar goto 6
bind = , 6, submap, reset
bind = , 7, exec, ~/.local/bin/claude-waybar goto 7
bind = , 7, submap, reset
bind = , 8, exec, ~/.local/bin/claude-waybar goto 8
bind = , 8, submap, reset
bind = , 9, exec, ~/.local/bin/claude-waybar goto 9
bind = , 9, submap, reset
bind = , a, exec, ~/.local/bin/claude-waybar focus
bind = , a, submap, reset
bind = , Tab, exec, ~/.local/bin/claude-waybar focus
bind = , Tab, submap, reset
bind = , n, exec, ~/.local/bin/claude-waybar next
bind = , j, exec, ~/.local/bin/claude-waybar next
bind = , p, exec, ~/.local/bin/claude-waybar prev
bind = , k, exec, ~/.local/bin/claude-waybar prev
bind = , c, exec, ~/.local/bin/claude-waybar clear
bind = , s, exec, ~/.local/bin/claude-waybar mute
bind = , escape, submap, reset
bind = , escape, exec, ~/.local/bin/claude-waybar mode
bind = , Return, submap, reset
bind = , Return, exec, ~/.local/bin/claude-waybar mode
bind = SUPER, C, submap, reset
bind = SUPER, C, exec, ~/.local/bin/claude-waybar mode
submap = reset
